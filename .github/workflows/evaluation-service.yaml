name: CI/CD & DevSecOps - evaluation-service

on:
  push:
    branches: [ main ]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service.yaml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVICE_NAME: evaluation-service
  MANIFEST_FILE: k8s/05-evaluation-service.yaml
  AWS_REGION: us-east-1

jobs:
  # ==========================================================================
  # 1. Build & Unit Test
  # ==========================================================================
  build-and-test:
    name: 1. Build & Unit Test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_NAME }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: '${{ env.SERVICE_NAME }}/go.sum'

      - name: Baixar dependências e Compilar binário
        run: |
          go mod download
          go build -v -o ${{ env.SERVICE_NAME }} .

      - name: Executar Testes Unitários
        run: go test -v ./...

  # ==========================================================================
  # 2. Linter / Static Analysis
  # ==========================================================================
  linter:
    name: 2. Linter (golangci-lint)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: '${{ env.SERVICE_NAME }}/go.sum'

      - name: Rodar golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.SERVICE_NAME }}
          args: --timeout=5m

  # ==========================================================================
  # 3. Security Scan (SAST & SCA) - Regra de Bloqueio em CRÍTICA / SAST
  # ==========================================================================
  security-scan:
    name: 3. Security Scan (SAST gosec & SCA Trivy)
    runs-on: ubuntu-latest
    needs: linter
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: SAST - Rodar Gosec (Static Application Security Testing)
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -severity high ./...

      - name: SCA - Rodar Trivy em modo FS (Software Composition Analysis)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  # ==========================================================================
  # 4. Docker Build, Container Scan, ECR Push & GitOps Update
  # ==========================================================================
  docker-and-gitops:
    name: 4. Docker Build, Scan, Push ECR & GitOps
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout do repositório (com histórico para GitOps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir Tag com Commit Hash (v1.0.0-<sha>)
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "IMAGE_TAG=v1.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Construir Imagem Docker local
        run: |
          docker build -t ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }} ./${{ env.SERVICE_NAME }}

      - name: Container Scan com Trivy (Bloqueia se houver vulnerabilidade CRÍTICA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e Push da Imagem para o AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker tag ${{ env.SERVICE_NAME }}:${IMAGE_TAG} ${ECR_REGISTRY}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}

      - name: GitOps - Atualizar Tag da Imagem no Manifesto Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i "s|image: .*/${{ env.SERVICE_NAME }}:.*|image: ${ECR_REGISTRY}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}|g" ${{ env.MANIFEST_FILE }}
          git add ${{ env.MANIFEST_FILE }}
          git diff --staged --quiet || (git commit -m "chore(gitops): update ${{ env.SERVICE_NAME }} image to ${IMAGE_TAG} [skip ci]" && git push origin main)

