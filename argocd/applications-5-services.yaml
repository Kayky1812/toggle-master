apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SEU_USUARIO/tech-challenge-fase-2.git
    targetRevision: main
    path: k8s
    directory:
      include: "{00-namespace.yaml,02-auth-service.yaml,07-ingress.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: toggle-master
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
