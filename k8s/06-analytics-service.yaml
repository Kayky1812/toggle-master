apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle-master
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: 706757000198.dkr.ecr.us-east-1.amazonaws.com/analytics-service:v1.0.0-8b94c08
        ports:
        - containerPort: 8005
        env:
        - name: PORT
          value: "8005"
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: toggle-master-config
              key: AWS_REGION
        - name: AWS_SQS_URL
          valueFrom:
            configMapKeyRef:
              name: toggle-master-config
              key: AWS_SQS_URL
        - name: AWS_DYNAMODB_TABLE
          valueFrom:
            configMapKeyRef:
              name: toggle-master-config
              key: AWS_DYNAMODB_TABLE
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: toggle-master
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
  - port: 8005
    targetPort: 8005
