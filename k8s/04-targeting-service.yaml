apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: toggle-master
  labels:
    app: targeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 706757000198.dkr.ecr.us-east-1.amazonaws.com/targeting-service:v2
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: toggle-master-config
              key: AUTH_SERVICE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: toggle-master-secrets
              key: TARGETING_DATABASE_URL
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: toggle-master
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
  - port: 8003
    targetPort: 8003
