apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: toggle-master
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
      - name: flag-service
        image: 706757000198.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1.0.0-8b94c08
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: toggle-master-config
              key: AUTH_SERVICE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: toggle-master-secrets
              key: FLAG_DATABASE_URL
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: toggle-master
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
  - port: 8002
    targetPort: 8002
